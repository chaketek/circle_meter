; circle_meter — rusEFI 連携 丸形ラムダ/排気温度メータ
; 構成管理: DOC-40 (docs/40_SUP8_cm_dev_environment.md)
;
; 依存は再現可能ビルドのため完全固定する (DOC-40 §1.1)。
; 更新する際は必ず QT-03 (FPS 実測) を再実行すること。

[platformio]
default_envs = m5dial
src_dir      = src
lib_dir      = lib
test_dir     = test
include_dir  = include

; ---------------------------------------------------------------- 共通
[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; DOC-22 §10 ビルド時設定 / OPN-02 で確定するまでの暫定値
    -DCM_TWAI_TX_GPIO=2
    -DCM_TWAI_RX_GPIO=1
    -DCM_LOG_LEVEL=3
build_unflags =
    -std=gnu++11

; ---------------------------------------------------------------- 実機
[env:m5dial]
platform  = espressif32@6.9.0
board     = m5stack-stamps3
framework = arduino

board_build.partitions  = partitions_8mb.csv
board_build.flash_mode  = qio
board_build.f_flash     = 80000000L
board_build.f_cpu       = 240000000L
; M5Dial の SoC は ESP32-S3FN8 = 8MB Flash / PSRAM なし。
; 実機ブリングアップで opi psram 初期化エラーを確認して確定した (DOC-12 §7)。
board_build.arduino.memory_type = qio_qspi

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 1500000

lib_deps =
    m5stack/M5Dial@1.0.3
    lvgl/lvgl@9.2.2

build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; LVGL は include/lv_conf.h を使う
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
build_unflags = ${common.build_unflags}

extra_scripts = pre:tools/inject_version.py

; ------------------------------------------------- 実機 (CAN シミュレータ版)
; SYS-61 / SWR-100: 車両に接続せず UI と FPS を確認する
[env:m5dial_sim]
extends      = env:m5dial
build_flags  = ${env:m5dial.build_flags} -DCM_ENABLE_CAN_SIM

; ---------------------------------------------------------------- PC 単体テスト
; SWE.4: ドメイン層 (lib/rusefi_can, lib/signal_model) は HW 非依存 (DEC-06)
[env:native]
platform       = native
test_framework = unity
build_flags =
    ${common.build_flags}
    -DCM_NATIVE_TEST
build_unflags = ${common.build_unflags}
; HW 依存ライブラリは native ビルドから除外する
lib_ignore =
    hal
    ui
build_src_filter = -<*>
