; circle_meter — rusEFI 連携 丸形ラムダ/排気温度メータ
; 構成管理: DOC-40 (docs/40_SUP8_cm_dev_environment.md)
;
; 依存は再現可能ビルドのため完全固定する (DOC-40 §1.1)。
; 更新する際は必ず QT-03 (FPS 実測) を再実行すること。

[platformio]
default_envs = m5dial
src_dir      = src
lib_dir      = lib
test_dir     = test
include_dir  = include

; ---------------------------------------------------------------- 共通
[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; DOC-22 §10 / OPN-02: CAN Unit は M5Dial の PORT.A (G13/G15) に接続している。
    ; ESP32-S3 の TWAI は GPIO マトリクス経由なので I2C 用ポートでも使える。
    ; 受信できない場合は TX/RX を入れ替えて再ビルドすれば切り分けられる。
    -DCM_TWAI_TX_GPIO=13
    -DCM_TWAI_RX_GPIO=15
    -DCM_LOG_LEVEL=3
build_unflags =
    -std=gnu++11

; ---------------------------------------------------------------- 実機
[env:m5dial]
platform  = espressif32@6.9.0
board     = m5stack-stamps3
framework = arduino

board_build.partitions  = partitions_8mb.csv
board_build.flash_mode  = qio
board_build.f_flash     = 80000000L
board_build.f_cpu       = 240000000L
; M5Dial の SoC は ESP32-S3FN8 = 8MB Flash / PSRAM なし。
; 実機ブリングアップで opi psram 初期化エラーを確認して確定した (DOC-12 §7)。
board_build.arduino.memory_type = qio_qspi

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 1500000

lib_deps =
    m5stack/M5Dial@1.0.3
    ; LVGL はフェーズ P4 (HMI 実装) で有効化する。
    ; 今有効にすると include/lv_conf.h が無いまま既定値でコンパイルされ、
    ; 警告が出るうえビルド時間だけ延びる。lv_conf.h と同時に入れること。
    ; バージョンは DOC-40 §1.1 に従い完全固定する:
    ;   lvgl/lvgl@9.2.2

build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I include
    -I assets
build_unflags = ${common.build_unflags}

; assets/logo.cpp（tools/make_logo.py が生成）もビルド対象に含める
build_src_filter = +<*> -<main_lcd21.cpp> +<../assets/logo.cpp>

extra_scripts = pre:tools/inject_version.py

; ------------------------------------------------- 実機 (CAN シミュレータ版)
; SYS-61 / SWR-100: 車両に接続せず UI と FPS を確認する
[env:m5dial_sim]
extends      = env:m5dial
build_flags  = ${env:m5dial.build_flags} -DCM_ENABLE_CAN_SIM

; ---------------------------------------------------------------- LCD-2.1 ブリングアップ
; OPN-12 (480x480 RGB の実描画性能) / OPN-15 (プラットフォーム) / RSK-14 を調べるための
; 使い捨ての計測用。本番コード (src/, lib/) にはまだ繋いでいない。
;
; 【第三者製プラットフォーム】pioarduino はコミュニティ維持。公式の espressif32 7.1.3 は
; Arduino コアが 2.0.17 系のままで、RGB パネルの bounce buffer が使えないため。
; URL とバージョンを固定する (DOC-40 §1.1)。採用の最終判断は計測後 (OPN-15)。
;   pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12 / ESP-IDF 5.5.5
[env:lcd21_bringup]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board     = waveshare_lcd21
framework = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600
build_src_filter = -<*> +<../bringup/lcd21/main.cpp>
lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -I boards/lcd21_conf

; ---------------------------------------------------------------- LCD-2.1 本番ファーム (P4)
; LVGL 9 + ESP32_Display_Panel (DEC-01 / OPN-15)。コードは src/main_lcd21.cpp と lib/ui。
; pioarduino は PowerShell から実行すること（Git Bash では idf_tools.py が失敗する。DOC-40 §2.3）。
; LVGL は完全固定 (DOC-40 §1.1)。更新したら QT-03 (FPS 実測) を再実行すること。
[env:lcd21]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board     = waveshare_lcd21
framework = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600
build_src_filter = -<*> +<main_lcd21.cpp> +<../assets/lcd21/logo.cpp> +<../assets/lcd21/fonts/>
extra_scripts = pre:tools/inject_version.py
lib_deps =
    lvgl/lvgl@9.2.2
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
; 描画は CPU 律速（OPN-12）。Arduino-ESP32 の既定は -Os だが、LVGL の描画ループは速度優先にする
build_unflags = -std=gnu++11 -Os
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -Wextra
    -DCM_BOARD_LCD21
    ; DOC-12 §3.1 / OPN-13: CAN は USB の D+ (GPIO20) = TX、D- (GPIO19) = RX。実機での確認は未了。
    -DCM_TWAI_TX_GPIO=20
    -DCM_TWAI_RX_GPIO=19
    -DCM_LOG_LEVEL=3
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I assets/lcd21
    -I boards/lcd21_conf

; SYS-01: lcd21 は既定の 500 kbps（rusEFI の既定。uaEFI 単独の車両）。こちらは CAN を 1 Mbps にしたもので、
; 作者の車両（MoTeC 併用でバスが 1 Mbps。2026-10-05 実測）用。設定メニューと NVS（SWR-65）ができたら不要になる
[env:lcd21_1m]
extends     = env:lcd21
build_flags = ${env:lcd21.build_flags} -DCM_CAN_BITRATE_KBPS=1000

; CAN の代わりに λ / EGT をスイープして画面だけ動かす（SWR-100 / 物理層なしで UI を確認する）
[env:lcd21_sim]
extends     = env:lcd21
build_flags = ${env:lcd21.build_flags} -DCM_ENABLE_CAN_SIM

; ---------------------------------------------------------------- PC 単体テスト
; SWE.4: ドメイン層 (lib/rusefi_can, lib/signal_model) は HW 非依存 (DEC-06)
[env:native]
platform       = native
test_framework = unity
build_flags =
    ${common.build_flags}
    -DCM_NATIVE_TEST
    -pthread          ; UT-15 の並行テストで std::thread を使う
build_unflags = ${common.build_unflags}
; HW 依存ライブラリは native ビルドから除外する
lib_ignore =
    hal
    ui
build_src_filter = -<*>
