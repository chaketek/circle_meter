# DOC-40 §4 / DOC-41 §2: 品質ゲート
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- S1
  lint:
    name: lint (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版を固定する。版が違うと整形結果が変わり、手元で整形したファイルが違反になる
      # （apt の 18 と手元の 23 で全体が落ちた。2026-10-12）。上げるときは DOC-40 §2.1 と同時に
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: clang-format
        run: |
          python -m pip install -q clang-format==23.1.1
          clang-format --version
          # include/ の自前ヘッダ（user_overrides.h など）も対象。git ls-files で生成物（version.h）を除く
          files=$(git ls-files 'src/*.cpp' 'src/*.h' 'lib/*.cpp' 'lib/*.h' 'test/*.cpp' 'test/*.h' 'include/*.h')
          echo "$files"
          clang-format --dry-run -Werror $files

  # ---------------------------------------------------------------- S2/S3/S4/S5
  # RSK-06 / RSK-10 / DEC-06 を CI で機械的に守る（DOC-41 §3.1）
  # 検査の中身は tools/guard.sh。CI とローカルで同じものを走らせる。
  guard:
    name: guard (安全・依存分離の静的チェック)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tools/guard.sh
        run: bash tools/guard.sh

  # ---------------------------------------------------------------- SWE.4
  test:
    name: test (native unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.cache/pip
          key: pio-native-${{ hashFiles('platformio.ini') }}
      - run: pip install --upgrade platformio
      - name: pio test -e native
        run: pio test -e native -v

  # ---------------------------------------------------------------- ビルド
  build:
    name: build (M5Dial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SWR-102: git describe のためタグを取得する
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: pio-esp32-${{ hashFiles('platformio.ini') }}
      - run: pip install --upgrade platformio

      - name: Build
        run: pio run -e m5dial -e m5dial_sim

      - name: サイズレポート
        run: |
          {
            echo '## Firmware size'
            echo '```'
            pio run -e m5dial -t size 2>&1 | grep -E 'RAM:|Flash:' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # SPL.2: Release に添付するファイル。機種・環境ごとに名前を付けて dist/ に集める
      - name: 成果物をまとめる
        run: bash tools/collect_firmware.sh dist m5dial m5dial_sim

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-m5dial-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------- ビルド (LCD-2.1)
  # pioarduino（第三者製プラットフォーム。OPN-15）+ ESP32_Display_Panel + LVGL を含む。
  # ローカルでは PowerShell から実行しないと失敗する（Git Bash の MSYS）が、Linux ランナーでは問題ない想定。
  build-lcd21:
    name: build (LCD-2.1 / pioarduino)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: pio-lcd21-${{ hashFiles('platformio.ini', 'boards/**') }}
      - run: pip install --upgrade platformio
      - name: Build
        run: pio run -e lcd21 -e lcd21_sim -e lcd21_1m
      - name: サイズレポート
        run: |
          {
            echo '## Firmware size (LCD-2.1)'
            echo '```'
            pio run -e lcd21 -t size 2>&1 | grep -E 'RAM:|Flash:' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 成果物をまとめる
        run: bash tools/collect_firmware.sh dist lcd21 lcd21_sim lcd21_1m

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-lcd21-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------- SPL.2
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, guard, test, build, build-lcd21]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 両機種の成果物（firmware-m5dial-* / firmware-lcd21-*）を 1 つのフォルダへ
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*-${{ github.sha }}
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
